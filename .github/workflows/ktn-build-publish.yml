name: ktn build & publish
on:
  push:
    branches: [ktn]
  pull_request:
    branches: [ktn] # build-gate for upstream-sync PRs (cloud only — safe for untrusted)
  workflow_dispatch:
concurrency:
  group: ktn-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # upstream composite: node 22 + yarn install
      - name: Build web + server bundle
        run: yarn build:server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/kautiontape/actual
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/ktn' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }} # PRs build-only (gate); pushes publish
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  package-api:
    name: Pack API for npm install
    runs-on: ubuntu-latest
    # ktn deploy triggers on this workflow's overall conclusion, so a failure
    # here would wedge prod deploys. Keep packaging non-blocking — the job still
    # shows red in the Actions tab. Remove this line if you would rather a
    # broken tarball hold the deploy back.
    continue-on-error: true
    permissions:
      contents: write # create and replace the rolling release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup # upstream composite: node 22 + yarn install
      - name: Build API
        run: yarn build:api
      # Must run after the build. The rewrite renames the package, which makes
      # `yarn build --scope=@actual-app/api` — and every other yarn workspace
      # command — stop matching it. Nothing yarn-based may run after this step.
      - name: Rewrite manifest for standalone install
        env:
          GH_RUN_NUMBER: ${{ github.run_number }}
        run: |
          KTN_VERSION_SUFFIX="${GH_RUN_NUMBER}.g${GITHUB_SHA::7}" \
            node .github/scripts/ktn-rewrite-api-manifest.mjs
      - name: Pack
        working-directory: packages/api
        run: |
          npm pack --ignore-scripts
          # Stable asset name so the download URL never changes.
          mv kautiontape-actual-api-*.tgz kautiontape-actual-api.tgz
      # Rolling release: delete and recreate so the tag follows ktn's tip while
      # the asset URL stays constant.
      - name: Publish rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/ktn'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf 'Fork build of the Actual API package, rebuilt on every push to `ktn`.\n\n'
            printf 'Install (URL is stable across builds):\n\n'
            printf '```\n'
            printf 'npm install https://github.com/Kautiontape/actual/releases/download/api-latest/kautiontape-actual-api.tgz\n'
            printf '```\n\n'
            printf 'Built from %s\n' "$GITHUB_SHA"
          } > "$RUNNER_TEMP/notes.md"
          gh release delete api-latest --yes --cleanup-tag || true
          gh release create api-latest \
            --target "$GITHUB_SHA" \
            --title 'Actual API (ktn fork) — rolling build' \
            --notes-file "$RUNNER_TEMP/notes.md" \
            packages/api/kautiontape-actual-api.tgz
