name: ktn promote sync
# Ships a rebase-mode sync branch: verifies its gate checks are green, then
# force-pushes sync/<tag> over ktn (replace, never merge — merging would
# weave both histories and double every carried patch in the next sync).
# The push deploys via the normal ktn push pipeline, and GitHub marks the
# open sync PR as merged automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'upstream tag to promote (e.g. v26.8.1) — its sync/<tag> branch replaces ktn'
      dry_run:
        type: boolean
        default: false
        description: 'verify only — report what would happen, push nothing'
# Same group as ktn-upstream-sync so a promote can never race a running
# sync attempt.
concurrency:
  group: fork-sync-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  promote:
    uses: Kautiontape/fork-sync/.github/workflows/fork-sync-promote.yml@main
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
